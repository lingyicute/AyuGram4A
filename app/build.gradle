plugins {
    id 'com.android.application'
}

android {
    namespace 'org.lyi.cha'
    compileSdk 34

    defaultConfig {
        applicationId "org.lyi.cha"
        minSdk 26
        // 注意：targetSdk 必须 < 29，否则 Android 10+ 的 SELinux 策略（untrusted_app_29+）
        // 禁止执行应用私有目录中的二进制文件（W^X），cloudflared 将无法运行。
        targetSdk 28
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def ksFile = System.getenv("KEYSTORE_FILE")
            if (ksFile != null && file(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_FILE") != null && file(System.getenv("KEYSTORE_FILE")).exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // targetSdk 28 是有意为之（见上），关闭对应的 lint 致命错误
        disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'com.google.android.material:material:1.11.0'
}
